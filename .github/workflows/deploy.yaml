name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  valtown:
    runs-on: [ubuntu-26.04]
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        experimental: true
        log_level: debug

    - run: |
        mise run install

    - run: |
        vt push
       env:
         VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
